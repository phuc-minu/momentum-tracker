<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Momentum AI</title>
    <link rel="stylesheet" href="/static/styles.css?v=202608191255" />
  </head>
  <body>
    <section id="loginScreen" class="login-screen" hidden>
      <form id="loginForm" class="login-panel">
        <p class="eyebrow">Private Dashboard</p>
        <h1>Stock Momentum AI</h1>
        <label class="field">
          <span>Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <button id="loginButton" class="primary-button" type="submit">
          <span>Login</span>
        </button>
        <p id="loginMessage" class="login-message"></p>
      </form>
    </section>

    <main id="dashboard" class="shell" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">Stock Momentum AI</p>
          <h1>Stock Momentum AI</h1>
        </div>
        <div class="topbar-actions">
          <div class="status-strip">
            <span id="apiStatus" class="status-dot loading"></span>
            <span id="apiStatusText">Checking</span>
          </div>
          <button id="logoutButton" class="secondary-button" type="button">Logout</button>
        </div>
      </header>

      <div id="modeNotice" class="mode-notice">Checking data mode</div>

      <nav class="tabs" aria-label="Dashboard views">
        <button class="tab-button active" type="button" data-tab="discoveryPanel">Discovery</button>
        <button class="tab-button" type="button" data-tab="scannerPanel">Momentum Scanner</button>
      </nav>

      <section id="discoveryPanel" class="tab-panel active">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Discovery</p>
            <h2>PostgreSQL Momentum Candidates</h2>
          </div>
          <span id="discoverMeta">Ready</span>
        </div>

        <section class="controls discover-controls" aria-label="Discovery controls">
          <label class="field">
            <span>Min Growth</span>
            <select id="growthInput">
              <option value="0.05" selected>5%</option>
              <option value="0.15">15%</option>
              <option value="0.20">20%</option>
              <option value="0.30">30%</option>
            </select>
          </label>
          <label class="field">
            <span>Period</span>
            <select id="periodInput">
              <option value="20" selected>1 month</option>
              <option value="60">3 months</option>
              <option value="126">6 months</option>
              <option value="252">12 months</option>
            </select>
          </label>
          <label class="field">
            <span>Limit</span>
            <select id="limitInput">
              <option value="10" selected>Top 10</option>
              <option value="25">Top 25</option>
              <option value="50">Top 50</option>
            </select>
          </label>
          <label class="toggle">
            <input id="excludeEarningsToggle" type="checkbox" />
            <span></span>
            <strong>Exclude Earnings</strong>
          </label>
          <button id="discoverButton" class="primary-button" type="button">
            <span class="button-icon">↻</span>
            <span>Discover</span>
          </button>
        </section>

        <div class="table-panel">
          <div class="table-wrap">
            <table class="discover-table">
              <colgroup>
                <col class="col-rank" />
                <col class="col-symbol" />
                <col class="col-price" />
                <col class="col-rsi" />
                <col class="col-score" />
                <col class="col-sector" />
                <col class="col-growth" />
                <col class="col-signal" />
                <col class="col-volume" />
                <col class="col-calls" />
                <col class="col-options" />
                <col class="col-catalyst-setup" />
              </colgroup>
              <thead>
                <tr>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="rank">
                      <span>Rank</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="symbol">
                      <span>Symbol</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="price">
                      <span>Price</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="rsi">
                      <span>RSI</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="score">
                      <span>Score</span>
                      <span class="sort-indicator" aria-hidden="true">↓</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="sector">
                      <span>Sector / Exchange</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th id="growthColumnHeader">
                    <button class="sort-button" type="button" data-sort-key="growth">
                      <span id="growthColumnLabel">2W Growth</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="signal">
                      <span>Signal</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="volume">
                      <span>Volume</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="calls">
                      <span>Calls</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="options">
                      <span>Options</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-button" type="button" data-sort-key="source">
                      <span>Source / Setup</span>
                      <span class="sort-indicator" aria-hidden="true">↕</span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="discoverBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="scannerPanel" class="tab-panel">
        <section class="controls" aria-label="Scanner controls">
          <label class="field field-wide">
            <span>Symbols</span>
            <input id="symbolsInput" value="NVDA,MSFT,AAPL,AVGO,AMD,META,GOOGL,AMZN,TSLA" />
          </label>
          <label class="field">
            <span>Benchmark</span>
            <input id="benchmarkInput" value="" placeholder="Optional" />
          </label>
          <label class="field">
            <span>History</span>
            <select id="countbackInput">
              <option value="180">180 days</option>
              <option value="260" selected>260 days</option>
              <option value="390">390 days</option>
              <option value="520">520 days</option>
            </select>
          </label>
          <button id="scanButton" class="primary-button" type="button">
            <span class="button-icon">↻</span>
            <span>Scan</span>
          </button>
        </section>

        <section class="metrics" aria-label="Scan summary">
          <div class="metric">
            <span>Leaders</span>
            <strong id="leaderCount">0</strong>
          </div>
          <div class="metric">
            <span>Average Score</span>
            <strong id="averageScore">--</strong>
          </div>
          <div class="metric">
            <span>Top Setup</span>
            <strong id="topSetup">--</strong>
          </div>
          <div class="metric">
            <span>Mode</span>
            <strong id="dataMode">--</strong>
          </div>
        </section>

        <section class="workspace">
          <div class="table-panel">
            <div class="panel-heading">
              <h2>Rankings</h2>
              <span id="scanMeta">Ready</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Rank</th>
                    <th>Symbol</th>
                    <th>Score</th>
                    <th>Grade</th>
                    <th>Setup</th>
                    <th>3M RS</th>
                    <th>50D</th>
                    <th>Volume</th>
                  </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
              </table>
            </div>
          </div>

          <aside class="detail-panel">
            <div class="panel-heading">
              <h2 id="detailTitle">Details</h2>
              <span id="detailGrade" class="grade-pill">--</span>
            </div>
            <canvas id="scoreCanvas" width="520" height="180" aria-label="Score distribution"></canvas>
            <div id="factorGrid" class="factor-grid"></div>
            <ul id="notesList" class="notes"></ul>
          </aside>
        </section>
      </section>
    </main>

    <script src="/static/app.js?v=202608201700"></script>
  </body>
</html>
