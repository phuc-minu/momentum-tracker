<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momentum Tracker</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Tech Momentum AI</p>
          <h1>Momentum Tracker</h1>
        </div>
        <div class="status-strip">
          <span id="apiStatus" class="status-dot"></span>
          <span id="apiStatusText">Checking</span>
        </div>
      </header>

      <section class="controls" aria-label="Scanner controls">
        <label class="field field-wide">
          <span>Symbols</span>
          <input id="symbolsInput" value="NVDA,MSFT,AAPL,AVGO,AMD,META,GOOGL,AMZN,TSLA" />
        </label>
        <label class="field">
          <span>Benchmark</span>
          <input id="benchmarkInput" value="QQQ" />
        </label>
        <label class="field">
          <span>History</span>
          <select id="countbackInput">
            <option value="180">180 days</option>
            <option value="260" selected>260 days</option>
            <option value="390">390 days</option>
            <option value="520">520 days</option>
          </select>
        </label>
        <label class="toggle">
          <input id="demoToggle" type="checkbox" checked />
          <span></span>
          <strong>Demo</strong>
        </label>
        <button id="scanButton" class="primary-button" type="button">
          <span class="button-icon">↻</span>
          <span>Scan</span>
        </button>
      </section>

      <section class="metrics" aria-label="Scan summary">
        <div class="metric">
          <span>Leaders</span>
          <strong id="leaderCount">0</strong>
        </div>
        <div class="metric">
          <span>Average Score</span>
          <strong id="averageScore">--</strong>
        </div>
        <div class="metric">
          <span>Top Setup</span>
          <strong id="topSetup">--</strong>
        </div>
        <div class="metric">
          <span>Mode</span>
          <strong id="dataMode">--</strong>
        </div>
      </section>

      <section class="workspace">
        <div class="table-panel">
          <div class="panel-heading">
            <h2>Rankings</h2>
            <span id="scanMeta">Ready</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Symbol</th>
                  <th>Score</th>
                  <th>Grade</th>
                  <th>Setup</th>
                  <th>3M RS</th>
                  <th>50D</th>
                  <th>Volume</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
        </div>

        <aside class="detail-panel">
          <div class="panel-heading">
            <h2 id="detailTitle">Details</h2>
            <span id="detailGrade" class="grade-pill">--</span>
          </div>
          <canvas id="scoreCanvas" width="520" height="180" aria-label="Score distribution"></canvas>
          <div id="factorGrid" class="factor-grid"></div>
          <ul id="notesList" class="notes"></ul>
        </aside>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
